name: Build Altron Android app

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }

      # Version: tag v1.2.3 -> 1.2.3 ; otherwise 1.0.<run number>. Build number = run number (always increasing).
      - name: Version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$V" >> $GITHUB_OUTPUT; echo "code=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      # Optional: Firebase config + release keystore from repository secrets
      - name: Secrets -> files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; echo "Firebase: yes"; else echo "Firebase: no (push disabled)"; fi
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore; echo "Keystore: yes"; else echo "Keystore: no (debug-signed build)"; fi

      - name: Build release APK
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Package
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release*.apk out/altron-app.apk
          cat > out/version.json <<JSON
          {"version":"${{ steps.ver.outputs.name }}","build":${{ steps.ver.outputs.code }},"min_build":1,"date":"$(date -u +%Y-%m-%d)"}
          JSON
          ls -la out

      - uses: actions/upload-artifact@v4
        with: { name: altron-app, path: out/ }

      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: 'out/altron-app.apk,out/version.json' }

      # Optional: publish straight to the website (app/dl/) over FTP when FTP secrets are set
      - name: Deploy to demo.altron.com.qa/app/dl/
        if: env.FTP_HOST != ''
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: out/
          server-dir: ${{ secrets.FTP_DIR }}
